{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>ViewIs IFC 3D</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #0b1120; font-family: "Segoe UI", sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #ui-bar {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(6px);
      border: 1px solid #334155; padding: 6px 10px; border-radius: 6px;
      color: #f8fafc; font-size: 11px; display: flex; gap: 8px; align-items: center;
    }
    #status-badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: #1e293b; color: #94a3b8; }
    #info-card {
      position: absolute; bottom: 12px; left: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(6px); border: 1px solid #334155;
      padding: 10px 14px; border-radius: 6px; color: #cbd5e1; font-size: 11px;
      max-width: 380px; display: none; line-height: 1.5; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #info-card strong { color: #f8fafc; font-size: 12px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="ui-bar">
    <span id="status-badge">Oczekiwanie na model IFC...</span>
  </div>
  <div id="info-card"></div>
  <div id="canvas-container"></div>
  <script type="module" src="{% static 'mep_viewer.js' %}"></script>
</body>
</html>
