{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>ViewIs IFC 3D</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #0b1120; font-family: "Segoe UI", sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #ui-bar {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(6px);
      border: 1px solid #334155; padding: 6px 10px; border-radius: 6px;
      color: #f8fafc; font-size: 11px; display: flex; gap: 8px; align-items: center;
    }
    #ui-bar input {
      background: #020617; border: 1px solid #1e293b; color: #fff;
      padding: 4px 8px; border-radius: 4px; font-size: 11px; outline: none; width: 180px;
    }
    #ui-bar button {
      background: #2563eb; border: none; color: #fff; padding: 4px 10px;
      border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600;
    }
    #status-badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: #1e293b; color: #94a3b8; }
    #viewmode-btn {
      position: absolute; top: 10px; right: 10px; z-index: 10;
      width: 36px; height: 36px; border-radius: 6px;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(6px);
      border: 1px solid #334155; color: #38bdf8; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #info-card {
      position: absolute; bottom: 12px; left: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(6px); border: 1px solid #334155;
      padding: 10px 14px; border-radius: 6px; color: #cbd5e1; font-size: 11px;
      max-width: 380px; display: none; line-height: 1.5; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #info-card strong { color: #f8fafc; font-size: 12px; }
    #nav-panel {
      position: absolute; bottom: 16px; right: 16px; z-index: 20;
      display: flex; flex-direction: column; align-items: stretch; gap: 6px;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(6px);
      border: 1px solid #334155; padding: 8px 10px; border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); color: #f8fafc;
    }
    #row-label { text-align: left; font-size: 11px; color: #cbd5e1; padding-left: 2px; }
    #nav-panel .row-btn {
      height: 28px; border-radius: 6px; background: #1e293b; border: 1px solid #475569;
      color: #38bdf8; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
    }
    #nav-panel .row-btn:hover { background: #2563eb; color: #fff; }
    #nav-arrows {
      display: none; justify-content: center; align-items: center; gap: 8px;
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; padding: 4px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 600;
    }
    #nav-arrows button {
      background: #1e293b; border: 1px solid #475569; color: #38bdf8;
      width: 26px; height: 26px; border-radius: 4px; cursor: pointer;
    }
    #nav-arrows button:hover { background: #2563eb; color: #fff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="ui-bar">
    <span id="status-badge">Oczekiwanie na model...</span>
    <input type="text" id="targetGuid" placeholder="Wklej GlobalId...">
    <button onclick="focusElementFromInput()">Podświetl</button>
    <button onclick="resetView()" style="background:#334155;">Reset</button>
  </div>

  <button id="viewmode-btn" onclick="toggleGhostMode()" title="Wireframe / Bryła">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
    </svg>
  </button>

  <div id="info-card"></div>
  <div id="nav-panel">
    <div id="row-label">RZĄD: -</div>
    <button class="row-btn" onclick="rowNav(-1)" title="Poprzedni wiersz">▲</button>
    <div id="nav-arrows">
      <button onclick="prevElement()">❮</button>
      <span id="nav-counter">0 / 0</span>
      <button onclick="nextElement()">❯</button>
    </div>
    <button class="row-btn" onclick="rowNav(1)" title="Następny wiersz">▼</button>
  </div>
  <div id="canvas-container"></div>
  <script type="module" src="{% static 'mep_viewer.js' %}"></script>
</body>
</html>
