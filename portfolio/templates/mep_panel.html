{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>ViewIs MEP Link</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="{% static 'mep_panel.css' %}">
</head>
<body>
  <div class="tabs">
    <button class="tab active" style="background: #3b6a8f; color: #fff;" onclick="handleTabClick('ilosci', '#3b6a8f', this)">Zestawienia</button>
    <button class="tab" onclick="handleTabClick('3d', '#4f46e5', this)">Podgląd 3D</button>
  </div>

  <div id="tab-ilosci" class="content active">
    <div class="model-picker-bar">
      <input type="file" id="ifcFolderInput" webkitdirectory directory multiple style="display:none;" onchange="onIfcFolderSelected(event)">
      <input type="file" id="ifcFilesInput" accept=".ifc" multiple style="display:none;" onchange="onIfcFilesSelected(event)">
      <button class="btn-picker" onclick="document.getElementById('ifcFolderInput').click()">Wskaż folder IFC</button>
      <button class="btn-picker secondary" onclick="document.getElementById('ifcFilesInput').click()">Wybierz pliki</button>
      <span id="models-status-label">Brak załadowanych modeli</span>
    </div>
    <div class="status" style="line-height: 1.6; margin-top: 8px;">
      Zaznacz wiersz w arkuszu Excela, aby zlokalizować i podświetlić element w modelu 3D.
    </div>
  </div>

  <div id="tab-3d" class="content">
    <iframe id="viewerFrame" src="/mep/viewer/"></iframe>
  </div>

  <div id="sheetsDrawer" class="sheets-drawer">
    <div class="sheets-toggle-bar" onclick="toggleSheetsDrawer()">
      <span>Arkusze</span>
      <span id="sheetsToggleArrow" class="drawer-arrow">▲</span>
    </div>
    <div id="sheetsList" class="sheets-tabs"></div>
  </div>

  <script src="{% static 'mep_panel.js' %}"></script>
</body>
</html>
