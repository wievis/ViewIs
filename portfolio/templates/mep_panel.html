{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>ViewIs MEP Link</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }
    body {
      background: #0f172a; color: #f8fafc; height: 100vh;
      display: flex; flex-direction: column; overflow: hidden; padding: 8px;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; border: 1px solid #334155; border-radius: 6px;
      padding: 6px 10px; margin-bottom: 8px; font-size: 11px;
    }
    .brand { font-weight: bold; color: #38bdf8; font-family: monospace; }
    .btn-file {
      background: #2563eb; color: #fff; border: none; padding: 4px 10px;
      border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .btn-file:hover { background: #1d4ed8; }
    #model-info { font-size: 10px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
    #viewer-frame {
      flex: 1; border: 1px solid #334155; border-radius: 6px; width: 100%; height: 100%; background: #0b1120;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <span class="brand">ViewIs MEP</span>
      <span id="model-info">&middot; Brak modelu</span>
    </div>
    <input type="file" id="localIfcInput" accept=".ifc" style="display:none;" onchange="onLocalIfcSelected(event)">
    <button class="btn-file" onclick="document.getElementById('localIfcInput').click()">Wskaż plik IFC</button>
  </div>
  <iframe id="viewer-frame" src="/mep/viewer/"></iframe>
  <script src="{% static 'mep_panel.js' %}"></script>
</body>
</html>
