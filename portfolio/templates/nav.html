{% load static %}
<header class="site-header" id="site-header">
    <div class="header-inner">
        <a class="brand" href="{% if lang == 'en' %}{% url 'home_en' %}{% else %}{% url 'home' %}{% endif %}">
            <span class="brand-name">View Is</span>
            <span class="brand-sub">COMPUTER DESIGNER</span>
        </a>

        <nav class="site-nav" id="site-nav" aria-label="Menu">
            <a href="{% if lang == 'en' %}{% url 'portfolio_en' %}{% else %}{% url 'portfolio' %}{% endif %}" class="{% if section == 'portfolio' %}active{% endif %}">Portfolio</a>
            <a href="{% if lang == 'en' %}{% url 'articles_en' %}{% else %}{% url 'articles' %}{% endif %}" class="{% if section == 'articles' %}active{% endif %}">{% if lang == 'en' %}Articles{% else %}Artykuły{% endif %}</a>
            <a href="{% if lang == 'en' %}{% url 'mep_landing_en' %}{% else %}{% url 'mep_landing' %}{% endif %}" class="{% if section == 'mep' %}active{% endif %}">MEP</a>
            <a href="{% if lang == 'en' %}{% url 'about_en' %}{% else %}{% url 'about' %}{% endif %}" class="{% if section == 'about' %}active{% endif %}">{% if lang == 'en' %}About{% else %}O mnie{% endif %}</a>
            <a href="{% if lang == 'en' %}{% url 'kontakt_en' %}{% else %}{% url 'kontakt' %}{% endif %}" class="{% if section == 'kontakt' %}active{% endif %}">{% if lang == 'en' %}Contact{% else %}Kontakt{% endif %}</a>
        </nav>

        <div class="header-tools">
            <input type="checkbox" class="checkbox lang-toggle" role="switch" id="lang-toggle" aria-label="PL / EN" {% if lang != 'en' %}checked{% endif %} />
            <input type="checkbox" class="checkbox theme-toggle" role="switch" id="theme-toggle" aria-label="Theme" />
            <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
        </div>
    </div>
</header>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lb-progress-bar" id="lb-progress-bar"></div>
    
    <div class="lb-bar lb-header">
        <div class="lb-meta-left">
            <span class="lb-brand-node">VIEWIS</span>
            <span class="lb-node-sep">/</span>
            <span class="lb-badge" id="lb-badge">RENDER</span>
        </div>
        <div class="lb-meta-center">
            <span class="lb-counter" id="lb-counter">01 / 01</span>
        </div>
        <div class="lb-meta-right">
            <button type="button" class="lb-btn-icon" id="lb-fullscreen" onclick="toggleLightboxFullscreen()" aria-label="Fullscreen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 8V5a1 1 0 0 1 1-1h3"></path>
                    <path d="M20 8V5a1 1 0 0 0-1-1h-3"></path>
                    <path d="M4 16v3a1 1 0 0 0 1 1h3"></path>
                    <path d="M20 16v3a1 1 0 0 1-1 1h-3"></path>
                </svg>
            </button>
            <button type="button" class="lb-btn-icon" onclick="closeLightbox()" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <button type="button" class="lb-nav prev" onclick="changePhoto(-1)" aria-label="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>

    <div class="lightbox-content"></div>

    <button type="button" class="lb-nav next" onclick="changePhoto(1)" aria-label="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </button>

    <div class="lb-bar lb-footer">
        <div class="lb-footer-left">
            <span class="lb-status-text" id="lb-status-text">STEROWANIE: KLIKNIJ I PRZECIĄGNIJ</span>
        </div>
        <div class="lb-footer-center">
            <div class="lb-thumbnails-wrap" id="lb-thumbnails-wrap">
                <div class="lb-thumbnails" id="lb-thumbnails"></div>
            </div>
        </div>
        <div class="lb-footer-right">
            <span class="lb-tag-engine" id="lb-tag-engine">STUDIO VIEWER</span>
        </div>
    </div>
</div>
